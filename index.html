<body>
<div class="wrap">
  <div class="hero">
    <div>
      <h1 id="wkTitle">This week</h1>
      <div class="sub" id="wkSub">Loading the slate…</div>
    </div>
    <div class="ctrl">
      <div class="wkstep">
        <button id="wkPrev" class="wkarrow" type="button" aria-label="Previous week"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button id="week" class="wkbtn" type="button" aria-label="Choose week" aria-expanded="false" aria-controls="wkpanel"></button>
        <button id="wkNext" class="wkarrow" type="button" aria-label="Next week"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <div id="wkpanel" class="setpanel wkpanel" role="dialog" aria-label="Choose week" hidden></div>
      </div>
      <button id="playBtn" class="gear" type="button" aria-label="Play Coach Andre's Bowl" title="Coach Andre's Bowl">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M7 8h10a4 4 0 0 1 4 4v1.5a3.5 3.5 0 0 1-6.3 2.1L13.5 14h-3l-1.2 1.6A3.5 3.5 0 0 1 3 13.5V12a4 4 0 0 1 4-4zM7.5 10.5v3M6 12h3M15.5 11.5h.01M17.5 13.5h.01"/></svg></button>
      <button id="newsBtn" class="gear newsbtn" type="button" aria-label="News">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M4 5h12v13a2 2 0 0 0 2 2H6a2 2 0 0 1-2-2V5zm12 4h4v9a2 2 0 0 1-4 0M7.5 9h5M7.5 12.5h5M7.5 16h3"/></svg><span id="newsDot" class="news-dot" hidden></span></button>
      <div class="settings">
        <button id="gear" class="gear" type="button" aria-label="Settings" aria-expanded="false" aria-controls="setpanel">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm7.4-3a7.4 7.4 0 0 0-.1-1.2l2-1.6-2-3.4-2.4 1a7.3 7.3 0 0 0-2-1.2L14.5 3h-5l-.4 2.6a7.3 7.3 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.6a7.4 7.4 0 0 0 0 2.4l-2 1.6 2 3.4 2.4-1a7.3 7.3 0 0 0 2 1.2l.4 2.6h5l.4-2.6a7.3 7.3 0 0 0 2-1.2l2.4 1 2-3.4-2-1.6c.1-.4.1-.8.1-1.2z"/></svg></button>
        <div id="setpanel" class="setpanel" role="dialog" aria-label="Settings" hidden></div>
      </div>
    </div>
  </div>
</div>
<nav class="tabs" aria-label="Views">
  <div class="wrap" role="tablist" id="tabs"></div>
</nav>
<main class="wrap" id="view"></main>

<div id="drawer" class="drawer" hidden>
  <button id="scrim" class="scrim" type="button" tabindex="-1" aria-label="Close"></button>
  <aside class="sheet" role="dialog" aria-modal="true" aria-labelledby="drawerTitle">
    <div class="sheet-bar">
      <button id="drawerBack" class="iconbtn" type="button" aria-label="Back" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <span id="drawerTitle" class="sheet-title"></span>
      <button id="drawerClose" class="iconbtn" type="button" aria-label="Close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
    </div>
    <div id="drawerScroll" class="sheet-scroll"><div id="drawerBody"></div></div>
  </aside>
</div>
