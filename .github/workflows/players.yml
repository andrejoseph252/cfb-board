name: Refresh team scouting

# Rosters, box scores, grades, run directions, penalties and who's out for the scout pages (data/players/).
# Sunday morning, once Saturday's games are final, and Wednesday for midweek roster changes.
on:
  schedule:
    - cron: "0 13 * * 0"   # Sunday 13:00 UTC
    - cron: "0 13 * * 3"   # Wednesday 13:00 UTC
  workflow_dispatch:

permissions:
  contents: write

# Shares the odds job's group, so the two never push over each other.
concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  players:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Finished games' box scores and player profiles, kept between runs so each run only fetches what's new
      # (ESPN starts refusing after about a thousand quick requests).
      - uses: actions/cache@v4
        with:
          path: .cache/espn
          key: espn-${{ github.run_id }}
          restore-keys: espn-
      - run: python scripts/players.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A data/players
          git diff --cached --quiet && exit 0
          git commit -m "Update team scouting"
          for i in 1 2 3; do
            git push && exit 0
            sleep $((i * 5))
            git pull --rebase
          done
          exit 1
