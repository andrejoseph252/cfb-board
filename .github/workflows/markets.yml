name: Refresh market odds and game threads

on:
  schedule:
    - cron: "0 * * * *"          # hourly all week
    - cron: "*/20 14-23 * * 6"   # every 20 min on Saturday (UTC)
    - cron: "*/20 0-5 * * 0"     # late Saturday night games (UTC Sunday)
  workflow_dispatch:

permissions:
  contents: write

# One run at a time: data/lines.json is appended to, so two overlapping runs would each start from the same file
# and the second push would drop the first run's points. Queued runs wait instead of being cancelled.
concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python scripts/fetch_markets.py
      - run: python scripts/fetch_threads.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/markets.json data/threads.json data/lines.json
          git diff --cached --quiet && exit 0
          git commit -m "Update market odds and game threads"
          # Someone may have pushed while this ran; replay the data commit on top and try again.
          for i in 1 2 3; do
            git push && exit 0
            sleep $((i * 5))
            git pull --rebase
          done
          exit 1
