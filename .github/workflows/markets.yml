name: Refresh market odds and game threads

on:
  schedule:
    - cron: "0 * * * *"          # hourly all week
    - cron: "*/20 14-23 * * 6"   # every 20 min on Saturday (UTC)
    - cron: "*/20 0-5 * * 0"     # late Saturday night games (UTC Sunday)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fetch_markets.py
      - run: python scripts/fetch_threads.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/markets.json data/threads.json
          git diff --cached --quiet || (git commit -m "Update market odds and game threads" && git push)
